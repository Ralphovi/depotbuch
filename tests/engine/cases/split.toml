name = "split"
rule = "proposal 0001, Edge cases: splits restate history onto the current basis"
working = """
Buy 10 units for 1000.00. A 4-for-1 split on 2024-03-01 makes them 40 units, still
costing 1000.00; it takes effect at the start of the day, before that day's sale.
The sale of 20 on the same day closes half the lot: cost 1000.00 x 20/40 = 500.00.
Realized gain: 600.00 - 500.00 = 100.00. Left: 20 units costing 500.00.
The day before the split: 10 units.
"""

[[activities]]
date = 2024-01-02
type = "buy"
asset = "X1"
units = "10"
cash = "-1000.00"

[[activities]]
date = 2024-03-01
type = "sell"
asset = "X1"
units = "-20"
cash = "600.00"

[[activities]]
date = 2024-03-01
type = "split"
asset = "X1"
ratio = "4"

[[expect]]
as_of = 2024-02-29
slice = { asset = "X1" }
units = "10"
invested_capital = "1000.00"

[[expect]]
as_of = 2024-03-01
slice = { asset = "X1" }
units = "20"
invested_capital = "500.00"
realized_gain = "100.00"
